# Integração contínua: lint, tipos e testes (unitários, interface, banco e API contra um Supabase local
# real), ponta a ponta no Chrome (fluxos, acessibilidade em 4 modos, responsividade) e build da imagem Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (Postgres + Storage)
        run: |
          supabase start -x studio,mailpit,edge-runtime,logflare,vector,imgproxy,postgres-meta,realtime
          supabase status -o env --override-name api.url=KAMBAN_TEST_SUPABASE_URL --override-name auth.secret_key=KAMBAN_TEST_SUPABASE_SECRET_KEY --override-name db.url=KAMBAN_TEST_DATABASE_URL | grep '^KAMBAN_TEST_' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run check

  e2e:
    name: Ponta a ponta (Chrome)
    runs-on: ubuntu-latest
    needs: check
    env:
      KAMBAN_E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (Postgres + Storage)
        run: |
          supabase start -x studio,mailpit,edge-runtime,logflare,vector,imgproxy,postgres-meta,realtime
          supabase status -o env --override-name api.url=KAMBAN_TEST_SUPABASE_URL --override-name auth.secret_key=KAMBAN_TEST_SUPABASE_SECRET_KEY --override-name db.url=KAMBAN_TEST_DATABASE_URL | grep '^KAMBAN_TEST_' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run e2e

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (Postgres + Storage)
        run: |
          supabase start -x studio,mailpit,edge-runtime,logflare,vector,imgproxy,postgres-meta,realtime
          supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.secret_key=SUPABASE_SECRET_KEY --override-name db.url=DATABASE_URL | grep -E '^(SUPABASE_URL|SUPABASE_SECRET_KEY|DATABASE_URL)=' | tr -d '"' >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t avanza:ci .
      - name: Sobe e confere a saúde
        run: |
          docker run -d --name avanza --network host \
            -e KAMBAN_HTTP=127.0.0.1:8090 -e KAMBAN_DB_SSL=disable -e KAMBAN_SECRET_KEY=ci-chave-do-servidor \
            -e KAMBAN_DATABASE_URL="$DATABASE_URL" -e KAMBAN_SUPABASE_URL="$SUPABASE_URL" -e KAMBAN_SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            -e KAMBAN_ADMIN_EMAIL=admin@ci.local -e KAMBAN_ADMIN_PASSWORD=CiSenha2026 avanza:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs avanza
          exit 1
